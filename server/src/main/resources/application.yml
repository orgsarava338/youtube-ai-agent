spring:
    application:
        name: youtube-agent
    config:
        import: optional:file:.env/.env.${spring.profiles.active:local}[.properties]

logging:
    pattern:
        console: "%d{yyyy-MM-dd HH:mm.SSS} %-5level %logger{0} [%X{requestId:-}] - %msg%n"
    level:
        root: INFO
        com:
            youtubeagent: DEBUG

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: when-authorized

youtube:
    google-o-auth:
        client-id: ${YOUTUBE_GOOGLE_CLIENT_ID}
        client-secret: ${YOUTUBE_GOOGLE_CLIENT_SECRET}
        redirect-uri: ${YOUTUBE_GOOGLE_REDIRECT_URI}
    
    token-storage:
        file-path: .data/youtube-token.enc
        encryption-key: ${YOUTUBE_TOKEN_ENCRYPTION_KEY}

ai:
    providers:
        ollama:
            base-url: http://localhost:11434
            model: qwen3:4b

        groq:
            api-key: ${AI_GROQ_API_KEY}
            base-url: https://api.groq.com/openai/v1

        gemini:
            api-key: ${AI_GEMINI_API_KEY}
            base-url: https://generativelanguage.googleapis.com

        huggingface:
            api-key: ${AI_HUGGINGFACE_API_KEY}
            base-url: https://router.huggingface.co

        openai:
            api-key: ${AI_OPENAI_API_KEY}
            base-url: https://api.openai.com

        openrouter:
            api-key: ${AI_OPENROUTER_API_KEY}
            base-url: https://openrouter.ai/api
        
        bytez:
            api-key: ${AI_BYTEZ_API_KEY}
            base-url: https://api.bytez.com
        
        nvidia:
            api-key: ${AI_NVIDIA_API_KEY}
            base-url: https://integrate.api.nvidia.com

    models:

        - id: meta-llama/llama-3.3-70b-instruct
          provider: openrouter
          free: true
          priority: 1
          capabilities: CHAT, JSON, TOOL_CALLING

        - id: google/gemma-3-27b-it
          provider: openrouter
          free: true
          priority: 2
          capabilities: CHAT, JSON

        - id: mistralai/mistral-nemo
          provider: openrouter
          free: true
          priority: 3
          capabilities: CHAT, JSON, TOOL_CALLING

        - id: meta-llama/llama-3.1-8b-instruct
          provider: openrouter
          free: true
          priority: 4
          capabilities: CHAT, JSON, TOOL_CALLING

        - id: google/gemma-2-9b-it
          provider: openrouter
          free: true
          priority: 5
          capabilities: CHAT, JSON

        - id: microsoft/phi-3-medium-128k-instruct
          provider: openrouter
          free: true
          priority: 6
          capabilities: CHAT, JSON

        - id: mistralai/mistral-7b-instruct
          provider: openrouter
          free: true
          priority: 7
          capabilities: CHAT, JSON, TOOL_CALLING

        - id: openchat/openchat-7b
          provider: openrouter
          free: true
          priority: 8
          capabilities: CHAT

        - id: meta-llama/llama-3.2-3b-instruct
          provider: openrouter
          free: true
          priority: 9
          capabilities: CHAT, JSON

        - id: google/gemma-3-4b-it
          provider: openrouter
          free: true
          priority: 10
          capabilities: CHAT
