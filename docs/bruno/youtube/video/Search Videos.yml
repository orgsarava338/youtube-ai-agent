info:
  name: Search Videos
  type: http
  seq: 3

http:
  method: GET
  url: "{{api.url}}/v1/youtube/search?query=music&maxResults=10"
  params:
    - name: query
      value: music
      type: query
    - name: maxResults
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true