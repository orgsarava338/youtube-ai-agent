info:
  name: Chat With Agent
  type: http
  seq: 1

http:
  method: POST
  url: "{{api.url}}/v1/agent/chat"
  body:
    type: json
    data: |-
      {
        "message": "Show me my playlists and then get the videos from the playlist 'YOGAN SERIES'. Give me the video titles."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
