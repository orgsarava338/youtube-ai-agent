info:
  name: Chat With Agent
  type: http
  seq: 1

http:
  method: POST
  url: "{{api.url}}/v1/agent/chat"
  body:
    type: json
    data: |-
      {
        "message": "List my playlists, find the videos in my playlists, and give me the titles of the videos."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
