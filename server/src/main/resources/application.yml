spring:
    application:
        name: youtube-agent
    config:
        import: optional:file:.env/.env.${spring.profiles.active:local}[.properties]


management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: when-authorized

ai:
    fallback-order: openrouter

    providers:
        ollama:
            base-url: http://localhost:11434
            model: qwen3:4b

        groq:
            api-key: ${AI_GROQ_API_KEY}
            base-url: https://api.groq.com/openai/v1
            model: llama-3.3-70b-versatile

        gemini:
            api-key: ${AI_GEMINI_API_KEY}
            base-url: https://generativelanguage.googleapis.com
            model: gemini-3.8-flash

        huggingface:
            api-key: ${AI_HUGGINGFACE_API_KEY}
            base-url: https://router.huggingface.co
            model: openai/gpt-oss-120b:fastest

        openai:
            api-key: ${AI_OPENAI_API_KEY}
            base-url: https://api.openai.com
            model: gpt-4o-mini

        openrouter:
            api-key: ${AI_OPENROUTER_API_KEY}
            base-url: https://openrouter.ai/api
            # model: meta-llama/llama-3.3-70b-instruct

    models:

        # OpenRouter
        - id: meta-llama/llama-3.3-70b-instruct
          provider: openrouter
          free: true
          priority: 10
          capabilities:
              - CHAT
              - JSON
              - TOOL_CALLING

        - id: meta-llama/llama-3.3-70b-instruct:free
          provider: openrouter
          free: true
          priority: 10
          capabilities:
              - CHAT
              - JSON
              - TOOL_CALLING

        - id: google/gemma-3-27b-it:free
          provider: openrouter
          free: true
          priority: 20
          capabilities:
              - CHAT
              - JSON
