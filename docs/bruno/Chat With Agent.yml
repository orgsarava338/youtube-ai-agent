info:
  name: Chat With Agent
  type: http
  seq: 1

http:
  method: POST
  url: "{{api.url}}/v1/agent/chat"
  body:
    type: json
    data: |-
      {
        "message": "Find my latest video about lifting weights and give me its title, views, likes, and the number of comments it has."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
